<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Script</title>

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta
      name="description"
      content="A smart budgeting calculator with a scripting language for financial planning"
    />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Budget$" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-deep: #0a0a0f;
        --bg-surface: #12121a;
        --bg-elevated: #1a1a24;
        --bg-light: #2b2b37;
        --bg-hover: #22222e;
        --border: #2a2a38;
        --border-subtle: #1f1f2a;
        --text-primary: #f0f0f5;
        --text-secondary: #8888a0;
        --text-muted: #55556a;
        --accent: #6ee7b7;
        --accent-dim: #34d399;
        --accent-bg: rgba(110, 231, 183, 0.1);
        --error: #f87171;
        --error-bg: rgba(248, 113, 113, 0.1);
        --warning: #fbbf24;
        --sidebar-width: 280px;
        --header-height: 52px;
      }

      progress {
        appearance: none; /* Hides default styling */
        -webkit-appearance: none;
        width: 100%;
        height: 10px;
        border: none; /* Removes default border */
        border-radius: 999px;
        background-color: var(--bg-light); /* The track */
        overflow: hidden;
      }

      progress::-webkit-progress-value {
        background: linear-gradient(
          45deg,
          var(--accent) 25%,
          var(--accent-dim) 25%,
          var(--accent-dim) 50%,
          var(--accent) 50%,
          var(--accent) 75%,
          var(--accent-dim) 75%,
          var(--accent-dim)
        );
        background-size: 20px 20px;
        border-radius: 999px;
        box-shadow: 0 0 15px var(--accent-bg);
        transition: width 0.4s ease;
        animation: moveStripes 1s linear infinite;
      }

      /* --- Firefox --- */
      progress::-moz-progress-bar {
        background-color: var(--accent);
        border-radius: 999px;
        box-shadow: 0 0 15px var(--accent-bg);
      }

      /* Stripe Animation */
      @keyframes moveStripes {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 20px 0;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body,
      html {
        height: 100%;
        width: 100%;
        font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont,
          sans-serif;
        background: var(--bg-deep);
        color: var(--text-primary);
        overflow: hidden;
      }

      /* Layout */
      .app {
        display: flex;
        height: 100%;
        width: 100%;
      }

      /* Sidebar */
      .sidebar {
        width: var(--sidebar-width);
        min-width: var(--sidebar-width);
        background: var(--bg-surface);
        border-right: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .sidebar-header {
        padding: 20px;
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo-icon {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, var(--accent) 0%, #3b82f6 100%);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        color: var(--bg-deep);
      }

      .logo-text {
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .notes-section {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 8px 12px;
      }

      .section-title {
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
      }

      .btn-new {
        background: var(--accent-bg);
        border: 1px solid rgba(110, 231, 183, 0.2);
        color: var(--accent);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
        font-family: inherit;
      }

      .btn-new:hover {
        background: rgba(110, 231, 183, 0.18);
        border-color: rgba(110, 231, 183, 0.35);
      }

      .notes-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .note-item {
        padding: 12px 14px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.15s ease;
        border: 1px solid transparent;
        position: relative;
      }

      .note-item:hover {
        background: var(--bg-hover);
      }

      .note-item.active {
        background: var(--bg-elevated);
        border-color: var(--border);
      }

      .note-item-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 4px;
      }

      .note-title {
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 180px;
      }

      .note-date {
        font-size: 0.7rem;
        color: var(--text-muted);
      }

      .note-preview {
        font-size: 0.78rem;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .note-actions {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0;
        transition: opacity 0.15s ease;
      }

      .note-item:hover .note-actions {
        opacity: 1;
      }

      .btn-delete {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.75rem;
        transition: all 0.15s ease;
      }

      .btn-delete:hover {
        background: var(--error-bg);
        color: var(--error);
      }

      .sidebar-footer {
        padding: 16px 20px;
        border-top: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .save-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 2s ease-in-out infinite;
      }

      .save-indicator.saving {
        background: var(--warning);
        animation: none;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .save-text {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      /* Main Content */
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        min-width: 0;
      }

      .editor-header {
        height: var(--header-height);
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border-subtle);
        background: var(--bg-surface);
      }

      .editor-title-input {
        background: none;
        border: none;
        font-size: 1rem;
        font-weight: 600;
        color: var(--text-primary);
        font-family: inherit;
        outline: none;
        padding: 8px 0;
        width: 100%;
        max-width: 400px;
      }

      .editor-title-input::placeholder {
        color: var(--text-muted);
      }

      .editor-meta {
        font-size: 0.75rem;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .editor-container {
        flex: 1;
        background: var(--bg-deep);
        position: relative;
      }

      /* CodeMirror Overrides */
      .cm-editor {
        height: 100% !important;
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        background: transparent !important;
      }

      .cm-editor .cm-scroller {
        padding: 24px;
      }

      .cm-editor .cm-content {
        padding: 0;
      }

      .cm-editor .cm-gutters {
        background: transparent;
        border: none;
        color: var(--text-muted);
      }

      .cm-editor .cm-activeLineGutter {
        background: transparent;
      }

      .cm-editor .cm-activeLine {
        background: rgba(255, 255, 255, 0.02);
      }

      .cm-focused {
        outline: none !important;
      }

      .cm-editor .cm-line {
        color: var(--text-primary);
      }

      .cm-editor .cm-cursor {
        border-left-color: var(--accent);
      }

      .cm-editor .cm-selectionBackground,
      .cm-editor .cm-content ::selection {
        background: rgba(110, 231, 183, 0.15) !important;
      }

      /* Annotations */
      .cm-budget-anno {
        color: var(--accent);
        font-weight: 500;
        margin-left: 16px;
        font-style: normal;
        background: var(--accent-bg);
        padding: 0px 10px;
        border-radius: 6px;
        font-size: 0.82rem;
        border: 1px solid rgba(110, 231, 183, 0.2);
        font-family: "JetBrains Mono", monospace;
      }

      .cm-error-anno {
        color: var(--error);
        font-weight: 500;
        margin-left: 16px;
        font-style: normal;
        background: var(--error-bg);
        padding: 3px 10px;
        border-radius: 6px;
        font-size: 0.82rem;
        border: 1px solid rgba(248, 113, 113, 0.2);
        font-family: "JetBrains Mono", monospace;
      }

      .cm-progress-anno {
        color: var(--accent);
        font-weight: 500;
        font-style: normal;
        background: var(--accent-bg);
        padding: 12px 12px;
        border-radius: 6px;
        font-size: 0.82rem;
        border: 1px solid rgba(110, 231, 183, 0.2);
        font-family: "JetBrains Mono", monospace;
        display: flex;
        justify-content: center;
        align-content: center;
        margin-top: 4px;
      }

      /* Empty state */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-muted);
        text-align: center;
        padding: 40px;
      }

      .empty-state-icon {
        font-size: 3rem;
        margin-bottom: 16px;
        opacity: 0.5;
      }

      .empty-state-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }

      .empty-state-text {
        font-size: 0.9rem;
        max-width: 280px;
        line-height: 1.5;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      /* Mobile Toggle Button */
      .mobile-toggle {
        display: none;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        color: var(--text-primary);
        flex-shrink: 0;
      }

      .mobile-toggle:hover {
        background: var(--bg-hover);
      }

      .mobile-toggle svg {
        width: 20px;
        height: 20px;
      }

      /* Sidebar Overlay */
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 99;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .sidebar-overlay.visible {
        opacity: 1;
      }

      /* Sidebar Close Button */
      .sidebar-close {
        display: none;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        background: none;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        color: var(--text-secondary);
        transition: all 0.15s ease;
      }

      .sidebar-close:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
      }

      /* Responsive */
      @media (max-width: 768px) {
        .sidebar {
          position: fixed;
          left: -100%;
          z-index: 100;
          transition: left 0.3s ease;
          width: 85%;
          max-width: 320px;
        }

        .sidebar.open {
          left: 0;
        }

        .sidebar-overlay {
          display: block;
          pointer-events: none;
        }

        .sidebar-overlay.visible {
          pointer-events: auto;
        }

        .mobile-toggle {
          display: flex;
        }

        .sidebar-close {
          display: flex;
        }

        .editor-header {
          padding: 0 16px;
          gap: 12px;
        }

        .editor-title-input {
          font-size: 0.9rem;
        }

        .editor-meta {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="sidebar-overlay" id="sidebar-overlay"></div>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <div class="logo-icon">B$</div>
            <span class="logo-text">Budget Script</span>
          </div>
          <button
            class="sidebar-close"
            id="sidebar-close"
            aria-label="Close sidebar"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <div class="notes-section">
          <div class="section-header">
            <span class="section-title">Notes</span>
            <button class="btn-new" id="btn-new-note">+ New</button>
          </div>
          <div class="notes-list" id="notes-list"></div>
        </div>

        <div class="sidebar-footer">
          <div class="save-indicator" id="save-indicator"></div>
          <span class="save-text" id="save-text">Auto-saved</span>
        </div>
      </aside>

      <main class="main">
        <header class="editor-header">
          <button
            class="mobile-toggle"
            id="mobile-toggle"
            aria-label="Open sidebar"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
          <input
            type="text"
            class="editor-title-input"
            id="note-title"
            placeholder="Untitled Note"
          />
          <div class="editor-meta">
            <span id="char-count">0 chars</span>
            <span id="line-count">0 lines</span>
          </div>
        </header>
        <div class="editor-container" id="editor-container"></div>
      </main>
    </div>

    <script type="module">
      import {
        EditorView,
        Decoration,
        ViewPlugin,
        WidgetType,
      } from "https://esm.sh/@codemirror/view"
      import { EditorState } from "https://esm.sh/@codemirror/state"
      import { basicSetup } from "https://esm.sh/codemirror"

      import {
        budgetScript,
        ParseError,
        EvaluatorError,
        parser,
      } from "../lang/src/index.ts"

      // ============ Storage Manager ============
      const STORAGE_KEY = "budget-script-notes"

      class NotesManager {
        constructor() {
          this.notes = this.loadNotes()
          this.activeNoteId = null
          this.saveTimeout = null
        }

        loadNotes() {
          try {
            const stored = localStorage.getItem(STORAGE_KEY)
            if (stored) {
              return JSON.parse(stored)
            }
          } catch (e) {
            console.error("Failed to load notes:", e)
          }
          return []
        }

        saveNotes() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(this.notes))
          } catch (e) {
            console.error("Failed to save notes:", e)
          }
        }

        createNote() {
          const note = {
            id: Date.now().toString(),
            title: "Untitled Note",
            content: ``,
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
          }
          this.notes.unshift(note)
          this.saveNotes()
          return note
        }

        updateNote(id, updates) {
          const note = this.notes.find((n) => n.id === id)
          if (note) {
            Object.assign(note, updates, {
              updatedAt: new Date().toISOString(),
            })
            this.saveNotes()
          }
          return note
        }

        deleteNote(id) {
          const index = this.notes.findIndex((n) => n.id === id)
          if (index !== -1) {
            this.notes.splice(index, 1)
            this.saveNotes()
          }
        }

        getNote(id) {
          return this.notes.find((n) => n.id === id)
        }

        getAllNotes() {
          return this.notes
        }
      }

      // ============ CodeMirror Widgets ============
      class AnnotationWidget extends WidgetType {
        constructor(val) {
          super()
          this.val = val
        }
        toDOM() {
          let wrap = document.createElement("span")
          wrap.setAttribute("aria-hidden", "true")
          wrap.className = "cm-budget-anno"
          wrap.textContent = `${this.val} kr`
          return wrap
        }
      }

      class ErrorAnnotationWidget extends WidgetType {
        constructor(val) {
          super()
          this.val = val
        }
        toDOM() {
          let wrap = document.createElement("span")
          wrap.setAttribute("aria-hidden", "true")
          wrap.className = "cm-error-anno"
          wrap.textContent = `${this.val}`
          return wrap
        }
      }

      class ProgressAnnotationWidget extends WidgetType {
        constructor(values) {
          super()
          this.values = values.map((value) => value.value)
        }
        toDOM() {
          let wrap = document.createElement("div")

          wrap.setAttribute("aria-hidden", "true")
          wrap.className = "cm-progress-anno"

          let progress = document.createElement("progress")
          progress.setAttribute("value", this.values[0] ?? 0)
          progress.setAttribute("max", this.values[1] ?? 100)
          wrap.appendChild(progress)

          return wrap
        }
      }

      const budgetPlugin = ViewPlugin.fromClass(
        class {
          constructor(view) {
            this.decorations = this.getDecorations(view)
          }
          update(update) {
            if (update.docChanged || update.viewportChanged) {
              this.decorations = this.getDecorations(update.view)
            }
          }
          getDecorations(view) {
            const widgets = []
            const docText = view.state.doc.toString()

            try {
              const ast = parser(docText)
              const evaluated = budgetScript(docText)
              const prints = evaluated.filter((a) => a.type === "print")
              const progress = evaluated.filter((a) => a.type === "progress")

              for (const result of prints) {
                try {
                  const line = view.state.doc.line(result.line + 1)
                  widgets.push(
                    Decoration.widget({
                      widget: new AnnotationWidget(result.value.value),
                      side: 1,
                    }).range(line.to)
                  )
                } catch (e) {
                  console.log("e", e)
                }
              }

              for (const result of progress) {
                try {
                  const line = view.state.doc.line(result.line + 1)
                  widgets.push(
                    Decoration.widget({
                      widget: new ProgressAnnotationWidget(result.value),
                      side: 1,
                    }).range(line.to)
                  )
                } catch (e) {
                  console.log("e", e)
                }
              }
              return Decoration.set(widgets, true)
            } catch (error) {
              if (
                error instanceof ParseError ||
                error instanceof EvaluatorError
              ) {
                const line = view.state.doc.line(error.line + 1)
                widgets.push(
                  Decoration.widget({
                    widget: new ErrorAnnotationWidget(error.message),
                    side: 1,
                  }).range(line.to)
                )
              }
              return Decoration.set(widgets, true)
            }
          }
        },
        {
          decorations: (v) => v.decorations,
        }
      )

      // ============ App Controller ============
      class App {
        constructor() {
          this.notesManager = new NotesManager()
          this.editorView = null
          this.activeNoteId = null
          this.saveTimeout = null

          this.initElements()
          this.initEventListeners()
          this.initNotes()
        }

        initElements() {
          this.notesList = document.getElementById("notes-list")
          this.editorContainer = document.getElementById("editor-container")
          this.noteTitleInput = document.getElementById("note-title")
          this.charCount = document.getElementById("char-count")
          this.lineCount = document.getElementById("line-count")
          this.saveIndicator = document.getElementById("save-indicator")
          this.saveText = document.getElementById("save-text")
          this.btnNewNote = document.getElementById("btn-new-note")
          this.sidebar = document.getElementById("sidebar")
          this.sidebarOverlay = document.getElementById("sidebar-overlay")
          this.mobileToggle = document.getElementById("mobile-toggle")
          this.sidebarClose = document.getElementById("sidebar-close")
        }

        initEventListeners() {
          this.btnNewNote.addEventListener("click", () => this.createNewNote())

          this.noteTitleInput.addEventListener("input", (e) => {
            if (this.activeNoteId) {
              this.queueSave({ title: e.target.value })
            }
          })

          // Mobile sidebar toggle
          this.mobileToggle.addEventListener("click", () => this.openSidebar())
          this.sidebarClose.addEventListener("click", () => this.closeSidebar())
          this.sidebarOverlay.addEventListener("click", () =>
            this.closeSidebar()
          )
        }

        openSidebar() {
          this.sidebar.classList.add("open")
          this.sidebarOverlay.classList.add("visible")
          document.body.style.overflow = "hidden"
        }

        closeSidebar() {
          this.sidebar.classList.remove("open")
          this.sidebarOverlay.classList.remove("visible")
          document.body.style.overflow = ""
        }

        initNotes() {
          const notes = this.notesManager.getAllNotes()

          if (notes.length === 0) {
            const note = this.notesManager.createNote()
            this.renderNotesList()
            this.selectNote(note.id)
          } else {
            this.renderNotesList()
            this.selectNote(notes[0].id)
          }
        }

        createNewNote() {
          const note = this.notesManager.createNote()
          this.renderNotesList()
          this.selectNote(note.id)
          this.closeSidebar()
          this.noteTitleInput.focus()
          this.noteTitleInput.select()
        }

        deleteNote(id) {
          if (this.notesManager.getAllNotes().length <= 1) {
            return // Don't delete the last note
          }

          this.notesManager.deleteNote(id)
          this.renderNotesList()

          const notes = this.notesManager.getAllNotes()
          if (notes.length > 0) {
            this.selectNote(notes[0].id)
          }
        }

        selectNote(id) {
          if (this.activeNoteId === id) {
            // Still close sidebar on mobile even if same note
            this.closeSidebar()
            return
          }

          this.activeNoteId = id
          const note = this.notesManager.getNote(id)

          if (!note) return

          this.noteTitleInput.value = note.title

          // Update active state in sidebar
          document.querySelectorAll(".note-item").forEach((el) => {
            el.classList.toggle("active", el.dataset.id === id)
          })

          this.initEditor(note.content)

          // Close sidebar on mobile after selecting a note
          this.closeSidebar()
        }

        initEditor(content) {
          if (this.editorView) {
            this.editorView.destroy()
          }

          const updateListener = EditorView.updateListener.of((update) => {
            if (update.docChanged) {
              const content = update.state.doc.toString()
              this.queueSave({ content })
              this.updateMetrics(content)
            }
          })

          const theme = EditorView.theme({
            "&": {
              backgroundColor: "transparent",
            },
            ".cm-scroller": {
              fontFamily: "'JetBrains Mono', monospace",
            },
            ".cm-gutters": {
              backgroundColor: "transparent",
              color: "var(--text-muted)",
              border: "none",
            },
            ".cm-activeLineGutter": {
              backgroundColor: "transparent",
            },
            ".cm-activeLine": {
              backgroundColor: "rgba(255, 255, 255, 0.02)",
            },
            ".cm-cursor": {
              borderLeftColor: "var(--accent)",
            },
            ".cm-selectionBackground": {
              backgroundColor: "rgba(110, 231, 183, 0.15) !important",
            },
          })

          const state = EditorState.create({
            doc: content,
            extensions: [
              basicSetup,
              budgetPlugin,
              EditorView.lineWrapping,
              updateListener,
              theme,
            ],
          })

          this.editorView = new EditorView({
            state,
            parent: this.editorContainer,
          })

          this.updateMetrics(content)
        }

        updateMetrics(content) {
          this.charCount.textContent = `${content.length} chars`
          this.lineCount.textContent = `${content.split("\n").length} lines`
        }

        queueSave(updates) {
          this.saveIndicator.classList.add("saving")
          this.saveText.textContent = "Saving..."

          if (this.saveTimeout) {
            clearTimeout(this.saveTimeout)
          }

          this.saveTimeout = setTimeout(() => {
            this.notesManager.updateNote(this.activeNoteId, updates)
            this.renderNotesList()

            this.saveIndicator.classList.remove("saving")
            this.saveText.textContent = "Auto-saved"
          }, 500)
        }

        renderNotesList() {
          const notes = this.notesManager.getAllNotes()

          this.notesList.innerHTML = notes
            .map((note) => {
              const preview =
                note.content.split("\n")[0].slice(0, 50) || "Empty note"
              const date = new Date(note.updatedAt)
              const dateStr = this.formatDate(date)

              return `
              <div class="note-item ${
                note.id === this.activeNoteId ? "active" : ""
              }" data-id="${note.id}">
                <div class="note-item-header">
                  <span class="note-title">${this.escapeHtml(note.title)}</span>
                  <span class="note-date">${dateStr}</span>
                </div>
                <div class="note-preview">${this.escapeHtml(preview)}</div>
                <div class="note-actions">
                  <button class="btn-delete" data-delete="${note.id}">✕</button>
                </div>
              </div>
            `
            })
            .join("")

          // Attach event listeners
          this.notesList.querySelectorAll(".note-item").forEach((el) => {
            el.addEventListener("click", (e) => {
              if (!e.target.closest(".btn-delete")) {
                this.selectNote(el.dataset.id)
              }
            })
          })

          this.notesList.querySelectorAll(".btn-delete").forEach((el) => {
            el.addEventListener("click", (e) => {
              e.stopPropagation()
              this.deleteNote(el.dataset.delete)
            })
          })
        }

        formatDate(date) {
          const now = new Date()
          const diff = now - date

          if (diff < 60000) return "Just now"
          if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`
          if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`
          if (diff < 604800000) return `${Math.floor(diff / 86400000)}d ago`

          return date.toLocaleDateString("en-US", {
            month: "short",
            day: "numeric",
          })
        }

        escapeHtml(str) {
          const div = document.createElement("div")
          div.textContent = str
          return div.innerHTML
        }
      }

      // Initialize app
      new App()

      // Register service worker for PWA
      /* if ("serviceWorker" in navigator) {
        // Use relative path for GitHub Pages compatibility
        const swPath = new URL("./sw.js", import.meta.url).href

          .register(swPath)
          .then((registration) => {
            console.log("SW registered:", registration.scope)
          })
          .catch((error) => {
            console.log("SW registration failed:", error)
          })
      } */
    </script>
  </body>
